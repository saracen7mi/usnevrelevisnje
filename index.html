<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lip-Volume Scanner v3.4</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0c20;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 92%;
            position: relative;
        }

        .header-tag {
            display: inline-block;
            background: rgba(255, 64, 129, 0.15);
            border: 1px solid rgba(255, 64, 129, 0.4);
            color: #ff4081;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 6px 0;
            font-weight: 700;
        }

        p.desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        /* Video / Camera Section */
        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid rgba(255, 64, 129, 0.3);
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Custom Scanner Overlay */
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Target Circle for Lips */
        .target-circle {
            width: 140px;
            height: 75px;
            border: 2px dashed #ff4081;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.4), inset 0 0 15px rgba(255, 64, 129, 0.2);
            transition: all 0.3s ease;
            animation: radarPulse 2s infinite;
        }

        @keyframes radarPulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 35px rgba(255, 64, 129, 0.8); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .target-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #ff4081;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ff4081;
        }

        .instruction-badge {
            position: absolute;
            bottom: 16px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Floating Volume Popups */
        .vol-pop {
            position: absolute;
            color: #ff4081;
            font-weight: 900;
            font-size: 18px;
            pointer-events: none;
            animation: floatUp 0.8s forwards ease-out;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(1.4); }
        }

        /* Progress Bar */
        .progress-box {
            margin-top: 18px;
        }

        .progress-bar-bg {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, #ff4081, #7c4dff);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .status-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        /* Phase 2: Calibration & Results */
        .phase {
            display: none;
        }

        .phase.active {
            display: block;
        }

        .alert-box {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid rgba(244, 67, 54, 0.4);
            color: #ff5252;
            padding: 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: left;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            position: relative;
            min-height: 54px;
            margin-top: 15px;
        }

        button {
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
